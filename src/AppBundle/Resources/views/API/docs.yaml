openapi: 3.0.0
info:
  title: 'Star Wars Destiny: ARH API'
  description: |
    **This API is under construction, please be patient.**
    
    ⚠️ - Return very large payloads.

  version: "0.1"

servers:
  - url: http://db.swdrenewedhope.com

paths:
  /api/public/card/{code}:
    get:
      tags: [Cards]
      summary: Return a single card's properties via its code.
      parameters:
        - name: code
          in: path
          required: true
          description: |
            | Part | Details|
            |------|--------|
            | Set ID | Which set the card belongs to (e.g. `01` = Awakenings) |
            | Card ID | Card position within the set, starting at `001`. |

            Therefore, `01001` becomes Captain Phasma, *Awakenings #1*.
          schema:
            type: integer
            example: "01001"
      responses:
        '200':
          description: Returns the properties of a card.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sides:
                    type: array
                    description: Testing
              example:
                sides: ["1RD", "2RD", "1F", "1Dc", "1R", "-"]
                set_code: AW
                set_name: Awakenings
                type_code: character
                type_name: Character
                faction_code: red
                faction_name: Command
                affiliation_code: villain
                affiliation_name: Villain
                rarity_code: L
                rarity_name: Legendary
                subtypes:
                  - { code: leader, name: Leader }
                  - { code: trooper, name: Trooper }
                position: 1
                code: "01001"
                ttscardid: "1300"
                name: Captain Phasma
                subtitle: Elite Trooper
                cost: null
                health: 11
                points: "12/15"
                text: "Your non-unique characters have the Guardian keyword."
                deck_limit: 1
                flavor: '"Whatever you''re planning, it won''t work."'
                illustrator: Darren Tan
                is_unique: true
                has_die: true
                has_errata: true
                flip_card: false
                url: http://db.swdrenewedhope.com/card/01001
                imagesrc: http://db.swdrenewedhope.com/bundles/app/images/cards/en/01/01001.jpg
                label: "<span class='icon-set-AW'></span> Captain Phasma - Elite Trooper"
                cp: 1215
        '500':
          description: This card does not exist.

  /api/public/cards/:
    get:
      tags: [Cards]
      summary: ⚠️ Return a list of all cards across all sets. ⚠️
      responses:
        '200':
          description: Returns all cards.
  
  /api/public/cards/{set_code}:
    get:
      tags: [Cards]
      summary: Return all cards belonging to a set.
      parameters:
        - name: set_code
          in: path
          required: true
          description: |
            Takes the codename of a set, for example:


             Awakenings  -> `AW` 


             Way of The Force  -> `WoTF` 
          schema:
            type: string
            example: "AW"
      responses:
        '200':
          description: Returns all cards from set_code.
        '404':
          description: This set does not exist.  
