admin:
    path: /
    methods: [GET]
    defaults:
        _controller: AppBundle:Admin:find

admin_find_user:
    path: /user/find_process
    methods: [POST]
    defaults:
        _controller: AppBundle:Admin:process

admin_show_user:
    path: /user/show/{user_id}
    methods: [GET]
    defaults:
        _controller: AppBundle:Admin:show
        
admin_user_enabled_toggle:
    path: /user/toggle_enabled/{user_id}
    methods: [GET]
    defaults:
        _controller: AppBundle:Admin:toggleEnabled
        
admin_user_decklists_show:
    path: /user/decklists/{user_id}
    methods: [GET]
    defaults:
        _controller: AppBundle:Admin:decklists

admin_decklist_delete:
    path: /decklist/delete/{decklist_id}
    methods: [GET]
    defaults:
        _controller: AppBundle:Admin:deleteDecklist
        
admin_user_comments_show:
    path: /user/comments/{user_id}
    methods: [GET]
    defaults:
        _controller: AppBundle:Admin:comments

admin_comment_hidden_toggle:
    path: /comment/toggle_hidden/{comment_id}
    methods: [GET]
    defaults:
        _controller: AppBundle:Admin:toggleHiddenComment

admin_comment_delete:
    path: /comment/delete/{comment_id}
    methods: [GET]
    defaults:
        _controller: AppBundle:Admin:deleteComment

admin_user_donation_toggle:
    path:      /admin/user/{user_id}/donation/toggle
    defaults:  { _controller: AppBundle:Admin:toggleDonation }
    methods:   [GET]
        